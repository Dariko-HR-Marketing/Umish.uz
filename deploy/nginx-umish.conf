# umish.uz uchun tavsiya etilgan Nginx sozlamasi (mavjud sozlama bilan solishtirish uchun).
# Yo'llarni (root, ssl_certificate) o'zingizning serveringizga moslang.

server {
    listen 80;
    listen [::]:80;
    server_name umish.uz www.umish.uz;
    return 301 https://umish.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name umish.uz www.umish.uz;

    ssl_certificate     /etc/letsencrypt/live/umish.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umish.uz/privkey.pem;

    root  /var/www/umish.uz;
    index index.html;

    # Faqat saytga kerakli fayllar; repo ichki fayllari (deploy, scripts, docs, .git) berilmasin
    location ~ ^/(\.git|deploy|scripts|docs|\.github)(/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    # Siqish (3D moduli va CSS/JS/SVG uchun muhim)
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

    # ES modul (js/cad-3d.js) to'g'ri MIME turi bilan berilishi shart
    types { text/javascript js mjs; }

    # Xavfsizlik sarlavhalari (CSP hozircha yo'q: sahifada inline skript va uslublar ko'p)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: SSL barqaror ishlayotganini tekshirgandan keyin yoqing
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTML, CSS, JS: har safar yangilanganini tekshirsin (ETag), eskirib qolmaydi
    location ~* \.(html|css|js|mjs|webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rasmlar va logotiplar: 7 kun keshlanadi (logotip almashtirilsa, fayl nomini ham o'zgartiring)
    location ~* ^/(images/opt|assets)/.*\.(webp|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
